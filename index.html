<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="에듀스케줄">
    <title>에듀스케줄 - 학생 학교·학원 일정 관리</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }
        body { 
            font-family: 'Inter', 'Pretendard', sans-serif;
            background-color: #f8fafc;
            height: 100dvh;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            padding-left: var(--safe-left);
            padding-right: var(--safe-right);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            touch-action: manipulation;
        }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .scheduler-container {
            flex: 1;
            overflow: auto;
            position: relative;
            background-color: #ffffff;
            border-radius: 0.75rem;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
        }

        .scheduler-grid {
            display: grid;
            width: max-content;
            min-width: 100%;
            position: relative;
        }

        .sticky-col-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }
        .sticky-row-header {
            position: sticky;
            left: 0;
            z-index: 50;
            background: #f8fafc;
            border-right: 1px solid #e2e8f0;
        }
        .sticky-corner {
            position: sticky;
            top: 0;
            left: 0;
            z-index: 60;
            background: #e2e8f0 !important;
            border-right: 1px solid #cbd5e1;
            border-bottom: 1px solid #cbd5e1;
            color: #334155;
            font-weight: 700;
        }

        .schedule-block {
            position: absolute;
            border-radius: 6px;
            padding: 4px 6px;
            font-size: 0.75rem;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
            z-index: 5;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }
        .schedule-block:hover {
            z-index: 30;
            transform: scale(1.03);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .time-tracker-line {
            position: absolute;
            left: 55px;
            right: 0;
            height: 2px;
            background-color: #ef4444;
            z-index: 40;
            pointer-events: none;
        }
        .time-tracker-dot {
            position: absolute;
            left: 0;
            top: -4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ef4444;
        }
    </style>
</head>
<body>
    <div id="sync-status" class="bg-blue-50 text-blue-600 text-[11px] font-medium px-4 py-1.5 flex items-center justify-center gap-2 border-b border-blue-100 hidden">
        <i class="fa-solid fa-cloud-arrow-up animate-pulse"></i> 클라우드 실시간 동기화 연결 중...
    </div>

    <header class="bg-slate-900 text-white p-3 sm:p-4 shrink-0 shadow-md flex justify-between items-center z-30">
        <div class="flex items-center gap-3">
            <div class="bg-blue-500 w-8 h-8 rounded-lg flex items-center justify-center shadow-inner">
                <i class="fa-solid fa-graduation-cap text-white text-sm"></i>
            </div>
            <div>
                <h1 class="text-base sm:text-lg font-bold leading-tight tracking-tight">에듀스케줄 <span class="text-[10px] bg-blue-500/20 text-blue-200 px-1.5 py-0.5 rounded ml-1 align-middle border border-blue-400/30">Pro</span></h1>
            </div>
        </div>
        
        <div class="flex gap-2">
            <button onclick="openStudentModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-2.5 py-1.5 rounded-md transition-colors flex items-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-user-group"></i><span class="hidden sm:inline">학생 관리</span>
            </button>
            <button onclick="openRoomModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-2.5 py-1.5 rounded-md transition-colors flex items-center gap-1.5 border border-slate-700">
                <i class="fa-solid fa-share-nodes"></i><span id="header-room-code" class="font-mono text-blue-300">-----</span>
            </button>
        </div>
    </header>

    <div class="bg-white px-3 sm:px-4 py-3 shrink-0 border-b border-slate-200 shadow-sm z-30">
        <!-- 다중 학생 선택 체크박스 및 범례 컬러 변경 영역 -->
        <div id="student-legend-bar" class="flex flex-wrap items-center gap-2 py-1 text-xs border-b border-slate-100 pb-2">
            <div class="flex items-center gap-2 mr-2">
                <span class="text-slate-600 font-bold text-xs flex items-center gap-1">
                    <i class="fa-solid fa-users text-blue-600"></i> 표시할 학생 선택:
                </span>
                <button onclick="toggleAllStudents(true)" class="text-[10px] bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold px-2 py-0.5 rounded border border-blue-200 transition-colors">전체선택</button>
                <button onclick="toggleAllStudents(false)" class="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold px-2 py-0.5 rounded border border-slate-200 transition-colors">전체해제</button>
            </div>
            <div id="student-legend-list" class="flex flex-wrap items-center gap-1.5"></div>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-2 mt-2">
            <div class="flex gap-1 sm:gap-2 overflow-x-auto no-scrollbar pb-0.5 flex-1">
                <button onclick="switchTab('weekly')" id="tab-weekly" class="tab-btn px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-colors bg-blue-600 text-white shadow-sm flex items-center gap-1.5 whitespace-nowrap">
                    <i class="fa-regular fa-calendar-days"></i> 주간 시간표
                </button>
                <button onclick="switchTab('daily')" id="tab-daily" class="tab-btn px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-colors bg-slate-100 text-slate-600 hover:bg-slate-200 flex items-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-list-check"></i> 오늘의 일정
                </button>
                <button onclick="switchTab('conflicts')" id="tab-conflicts" class="tab-btn px-3 py-1.5 rounded-md text-xs sm:text-sm font-medium transition-colors bg-slate-100 text-slate-600 hover:bg-slate-200 flex items-center gap-1.5 whitespace-nowrap relative">
                    <i class="fa-solid fa-triangle-exclamation text-amber-500"></i> 일정 충돌 검사
                    <span id="conflict-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full hidden">0</span>
                </button>
            </div>

            <div class="flex gap-2">
                <button onclick="openScheduleModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm px-3 py-1.5 rounded-md transition-colors font-medium flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-plus text-xs"></i> 일정 등록
                </button>
                <button onclick="openSettingsModal()" class="px-2 py-1.5 rounded-md text-xs text-slate-500 hover:bg-slate-100 transition-colors flex items-center gap-1 border border-slate-200">
                    <i class="fa-solid fa-gear"></i> 설정
                </button>
            </div>
        </div>
    </div>

    <main class="flex-1 flex flex-col p-2 sm:p-4 overflow-hidden relative">
        <div id="view-weekly" class="flex-1 flex flex-col min-h-0 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="px-3 py-2 border-b border-slate-100 flex items-center gap-2 overflow-x-auto no-scrollbar shrink-0 bg-slate-50/50">
                <span class="text-xs text-slate-500 font-medium pl-1 shrink-0">보기:</span>
                <button onclick="setDayFilter('all')" id="day-filter-all" class="day-filter-btn px-2.5 py-1 text-xs rounded-full bg-blue-100 text-blue-700 font-bold shrink-0 transition-colors">전체(7일)</button>
                <div id="day-filters-container" class="flex gap-1"></div>
            </div>
            
            <div class="px-3 py-2 flex flex-wrap gap-x-3 gap-y-1 text-[11px] text-slate-600 shrink-0 border-b border-slate-100">
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span> 학교수업</span>
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-purple-500"></span> 학원</span>
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> 과외</span>
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-pink-500"></span> 예체능</span>
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span> 자습/숙제</span>
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-teal-500"></span> 방문학습</span>
            </div>

            <div class="scheduler-container" id="scheduler-scroll-area">
                <div id="scheduler-grid" class="scheduler-grid text-slate-700"></div>
            </div>
        </div>

        <div id="view-daily" class="hidden flex-1 flex flex-col min-h-0 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden p-4">
            <div class="flex justify-between items-center mb-4 shrink-0">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-regular fa-calendar-check text-blue-600"></i> 오늘의 일정 <span id="today-date-text" class="text-sm font-normal text-slate-500"></span>
                </h2>
                <button onclick="copyDailyAgenda()" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 text-xs px-3 py-1.5 rounded-md font-medium flex items-center gap-1.5 transition-colors shadow-sm">
                    <i class="fa-solid fa-comment-dots"></i> 카카오톡 요약 복사
                </button>
            </div>
            <div id="daily-agenda-list" class="flex-1 overflow-y-auto space-y-3 pr-2"></div>
        </div>

        <div id="view-conflicts" class="hidden flex-1 flex flex-col min-h-0 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden p-4">
            <div class="mb-4 shrink-0 text-center py-4 bg-slate-50 rounded-lg border border-slate-100">
                <i class="fa-solid fa-shield-halved text-3xl text-blue-500 mb-2"></i>
                <h2 class="text-base font-bold text-slate-800">스마트 스케줄 충돌 검사기</h2>
                <p class="text-xs text-slate-500 mt-1">시간이 겹치거나 이동시간이 15분 미만인 일정을 자동으로 찾아냅니다.</p>
            </div>
            <div id="conflict-list" class="flex-1 overflow-y-auto space-y-3 pr-2"></div>
        </div>
    </main>

    <div id="student-modal" class="fixed inset-0 bg-black/50 z-[200] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center p-4 border-b border-slate-100 shrink-0">
                <h3 class="text-base font-bold text-slate-800"><i class="fa-solid fa-user-group text-emerald-600 mr-2"></i>학생 관리</h3>
                <button onclick="closeStudentModal()" class="text-slate-400 hover:text-slate-600 w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex-1 bg-slate-50">
                <div id="student-list" class="space-y-2 mb-4"></div>
                <div class="bg-white p-3 rounded-lg border border-slate-200 shadow-sm mt-4">
                    <h4 class="text-xs font-bold text-slate-700 mb-2 border-b pb-1"><i class="fa-solid fa-user-plus mr-1"></i>새로운 학생 추가</h4>
                    <form id="add-student-form" onsubmit="handleAddStudent(event)" class="space-y-3">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] font-medium text-slate-500 mb-1">이름 (필수)</label>
                                <input type="text" id="new-std-name" required class="w-full p-2 text-sm bg-slate-50 border border-slate-200 rounded-md focus:outline-none focus:ring-1 focus:ring-emerald-500" placeholder="예: 홍길동">
                            </div>
                            <div>
                                <label class="block text-[10px] font-medium text-slate-500 mb-1">학년/분류</label>
                                <input type="text" id="new-std-grade" class="w-full p-2 text-sm bg-slate-50 border border-slate-200 rounded-md focus:outline-none focus:ring-1 focus:ring-emerald-500" placeholder="예: 중2">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] font-medium text-slate-500 mb-1">학교/소속 (선택)</label>
                            <input type="text" id="new-std-school" class="w-full p-2 text-sm bg-slate-50 border border-slate-200 rounded-md focus:outline-none focus:ring-1 focus:ring-emerald-500" placeholder="학교 이름 입력">
                        </div>
                        <div>
                            <label class="block text-[10px] font-medium text-slate-500 mb-1">범례 색상 지정</label>
                            <div class="flex items-center gap-2">
                                <input type="color" id="new-std-color" value="#2563eb" class="w-8 h-8 rounded border border-slate-200 cursor-pointer p-0 bg-transparent">
                                <span class="text-xs text-slate-500">학생을 구분할 나만의 색상을 선택하세요.</span>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-emerald-600 text-white text-sm py-2 rounded-md font-medium hover:bg-emerald-700 transition-colors shadow-sm">추가하기</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="schedule-modal" class="fixed inset-0 bg-black/50 z-[200] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden max-h-[95dvh] flex flex-col">
            <div class="flex justify-between items-center p-3 sm:p-4 border-b border-slate-100 shrink-0 bg-slate-50">
                <h3 id="modal-title" class="text-base font-bold text-slate-800">일정 등록</h3>
                <button onclick="closeScheduleModal()" class="text-slate-400 hover:text-slate-600 p-1"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div class="p-4 overflow-y-auto flex-1">
                <form id="schedule-form" class="space-y-3">
                    <input type="hidden" id="edit-id">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">대상 학생</label>
                        <select id="s-student" class="w-full p-2 bg-slate-50 border border-slate-200 text-sm rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">일정 제목 (과목/학원명)</label>
                        <input type="text" id="s-title" required class="w-full p-2 bg-slate-50 border border-slate-200 text-sm rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="예: 청솔 수학학원">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">일정 유형</label>
                            <select id="s-type" class="w-full p-2 bg-slate-50 border border-slate-200 text-sm rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="school">학교수업</option>
                                <option value="academy">학원</option>
                                <option value="tutor">과외</option>
                                <option value="art">예체능</option>
                                <option value="self">자습/숙제</option>
                                <option value="visit">방문학습</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">요일</label>
                            <select id="s-day" class="w-full p-2 bg-slate-50 border border-slate-200 text-sm rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="1">월요일</option>
                                <option value="2">화요일</option>
                                <option value="3">수요일</option>
                                <option value="4">목요일</option>
                                <option value="5">금요일</option>
                                <option value="6">토요일</option>
                                <option value="0">일요일</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">시작 시간</label>
                            <input type="time" id="s-start" required class="w-full p-2 bg-slate-50 border border-slate-200 text-sm rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">종료 시간</label>
                            <input type="time" id="s-end" required class="w-full p-2 bg-slate-50 border border-slate-200 text-sm rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 bg-blue-50/50 p-2.5 rounded-lg border border-blue-100">
                        <div>
                            <label class="block text-[11px] font-bold text-blue-900 mb-1"><i class="fa-solid fa-bus text-blue-600 mr-1"></i>차량 탑승 위치</label>
                            <input type="text" id="s-pickup" class="w-full p-2 bg-white border border-blue-200 text-sm rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="예: 아파트 정문 앞">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-blue-900 mb-1"><i class="fa-solid fa-flag-checkered text-emerald-600 mr-1"></i>차량 하차 위치</label>
                            <input type="text" id="s-dropoff" class="w-full p-2 bg-white border border-blue-200 text-sm rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="예: 학원 건물 앞">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 bg-amber-50/50 p-2.5 rounded-lg border border-amber-100">
                        <div>
                            <label class="block text-[11px] font-bold text-amber-900 mb-1"><i class="fa-solid fa-bell text-amber-600 mr-1"></i>시작 전 알람 (기기별 개별)</label>
                            <select id="s-alarm-before" class="w-full p-2 bg-white border border-amber-200 text-sm rounded-md focus:outline-none focus:ring-2 focus:ring-amber-500">
                                <option value="0">알람 없음</option>
                                <option value="5">5분 전</option>
                                <option value="10">10분 전</option>
                                <option value="15">15분 전</option>
                                <option value="30">30분 전</option>
                                <option value="60">1시간 전</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-amber-900 mb-1"><i class="fa-solid fa-bell text-amber-600 mr-1"></i>종료 전 알람 (기기별 개별)</label>
                            <select id="s-alarm-end-before" class="w-full p-2 bg-white border border-amber-200 text-sm rounded-md focus:outline-none focus:ring-2 focus:ring-amber-500">
                                <option value="0">알람 없음</option>
                                <option value="5">5분 전</option>
                                <option value="10">10분 전</option>
                                <option value="15">15분 전</option>
                                <option value="30">30분 전</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">메모 (준비물/과제)</label>
                        <input type="text" id="s-memo" class="w-full p-2 bg-slate-50 border border-slate-200 text-sm rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="숙제, 교재 등 간략히 입력">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1">D-Day 설정 (시험/마감일 등)</label>
                        <input type="date" id="s-dday" class="w-full p-2 bg-slate-50 border border-slate-200 text-sm rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </form>
            </div>
            
            <div class="p-3 sm:p-4 border-t border-slate-100 flex gap-2 shrink-0 bg-slate-50">
                <button type="button" id="btn-delete-schedule" onclick="deleteSchedule()" class="hidden bg-red-100 hover:bg-red-200 text-red-600 text-sm px-4 py-2 rounded-md font-medium transition-colors">삭제</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA5aOOZnCUw0KvlnGBEaavgRTKdiL4y7KI",
            authDomain: "edu-schedule-c2a63.firebaseapp.com",
            projectId: "edu-schedule-c2a63",
            storageBucket: "edu-schedule-c2a63.firebasestorage.app",
            messagingSenderId: "943625928058",
            appId: "1:943625928058:web:34cbd841f2ad3dfe04aac3",
            measurementId: "G-PZRSRCB1WX"
        };

        let app, auth, firestoreDb;
        let schedulesRef = null;
        let studentsRef = null;
        let isFirebaseActive = false;
        
        window.students = [];
        window.schedules = [];
        window.selectedStudentIds = new Set();
        window.hasInitializedSelections = false;
        
        // FIXED Room Code to guarantee data persistence across reloads/updates
        window.currentRoomCode = localStorage.getItem('eduschedule_room_code') || 'ROOM_001';
        localStorage.setItem('eduschedule_room_code', window.currentRoomCode);

        // Preset palette options
        const studentPalettes = [
            { badgeBg: '#2563eb', border: '#1d4ed8', lightBg: '#eff6ff', text: '#1e40af', name: '블루' },
            { badgeBg: '#e11d48', border: '#be123c', lightBg: '#fff1f2', text: '#9f1239', name: '로즈' },
            { badgeBg: '#059669', border: '#047857', lightBg: '#ecfdf5', text: '#065f46', name: '에메랄드' },
            { badgeBg: '#d97706', border: '#b45309', lightBg: '#fffbeb', text: '#92400e', name: '앰버' },
            { badgeBg: '#7c3aed', border: '#6d28d9', lightBg: '#f5f3ff', text: '#5b21b6', name: '바이올렛' },
            { badgeBg: '#0891b2', border: '#0e7490', lightBg: '#ecfeff', text: '#155e75', name: '시안' }
        ];

        window.getStudentColor = function(studentId) {
            const std = window.students.find(s => s.id === studentId);
            const idx = window.students.findIndex(s => s.id === studentId);
            const defaultPal = studentPalettes[(idx >= 0 ? idx : 0) % studentPalettes.length];

            if (std && /^#[0-9a-f]{6}$/i.test(std.color || '')) {
                const color = std.color.toLowerCase();
                return {
                    badgeBg: color,
                    border: color,
                    lightBg: color + '18',
                    text: '#ffffff',
                    name: '커스텀'
                };
            }
            return defaultPal;
        };

        window.updateStudentColor = async function(studentId, newColor) {
            const std = window.students.find(s => s.id === studentId);
            if (!std || !/^#[0-9a-f]{6}$/i.test(newColor || '')) return;
            std.color = newColor.toLowerCase();
            saveData();
            renderApp();

            if (isFirebaseActive && firestoreDb && auth.currentUser && std.fbId) {
                try {
                    await updateDoc(doc(studentsRef, std.fbId), { color: newColor });
                } catch(e) { console.warn(e); }
            }
            window.showToast(`${std.name} 학생의 색상이 변경되었습니다.`);
        };
        
        // Load persistent settings safely from localStorage
        let savedSettings = null;
        try {
            savedSettings = JSON.parse(localStorage.getItem('eduschedule_settings'));
        } catch(e) {}

        window.settings = savedSettings || {
            visibleDays: [1, 2, 3, 4, 5, 6, 0], // Include ALL 7 days by default so schedules on Sunday are never hidden!
            startHour: 8,
            endHour: 22
        };

        const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
        let currentDayFilter = 'all'; 

        // Treat corrupted or manually edited localStorage values as empty arrays.
        // This keeps a bad browser cache entry from preventing the app from starting.
        function parseStoredArray(value) {
            if (!value) return [];
            try {
                const parsed = JSON.parse(value);
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) {
                console.warn('Ignoring invalid local data:', error);
                return [];
            }
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            })[char]);
        }

        function encodeId(value) {
            return encodeURIComponent(String(value ?? ''));
        }

        function getDeletedIds() {
            try {
                return new Set(JSON.parse(localStorage.getItem('eduschedule_deleted_ids_' + window.currentRoomCode) || '[]'));
            } catch(e) {
                return new Set();
            }
        }

        function markDeletedId(id) {
            const set = getDeletedIds();
            set.add(id);
            localStorage.setItem('eduschedule_deleted_ids_' + window.currentRoomCode, JSON.stringify(Array.from(set)));
        }

        window.copyToClipboard = function(text, successMsg = "클립보드에 복사되었습니다!") {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    window.showToast(successMsg);
                } else {
                    window.showToast("복사에 실패했습니다.", "error");
                }
            } catch (err) {
                window.showToast("복사 권한이 차단되었습니다.", "error");
            }
            document.body.removeChild(textarea);
        };

        window.getLocalAlarm = function(schId) {
            const saved = localStorage.getItem('eduschedule_alarm_' + schId);
            if (saved) {
                try { return JSON.parse(saved); } catch(e) {}
            }
            return { alarmBefore: 10, alarmEndBefore: 0 };
        };

        window.saveLocalAlarm = function(schId, alarmBefore, alarmEndBefore) {
            localStorage.setItem('eduschedule_alarm_' + schId, JSON.stringify({ alarmBefore: Number(alarmBefore), alarmEndBefore: Number(alarmEndBefore) }));
        };

        window.testAlarmNotification = function() {
            const msg = "[알람 테스트] 김지훈 학생의 '청솔 수학학원' 일정이 10분 전입니다!";
            window.showToast(msg, 'warning');
            if ("Notification" in window) {
                if (Notification.permission === "granted") {
                    new Notification("에듀스케줄 알람 테스트", { body: msg });
                } else if (Notification.permission !== "denied") {
                    Notification.requestPermission().then(permission => {
                        if (permission === "granted") {
                            new Notification("에듀스케줄 알람 테스트", { body: msg });
                        }
                    });
                }
            }
        };

        window.getFutureDateStr = function(daysToAdd) {
            const date = new Date();
            date.setDate(date.getDate() + daysToAdd);
            return date.toISOString().split('T')[0];
        };
        
        window.timeToMins = function(t) { 
            const [h,m] = t.split(':').map(Number); 
            return h * 60 + m; 
        };
        
        window.minsToStr = function(mins) {
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
        };

        window.showConfirmModal = function(msg, onConfirm, title="확인") {
            const modal = document.getElementById('confirm-modal');
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-msg').innerText = msg;
            modal.classList.remove('hidden');
            
            const okBtn = document.getElementById('confirm-ok-btn');
            const cancelBtn = document.getElementById('confirm-cancel-btn');
            
            const newOk = okBtn.cloneNode(true);
            const newCancel = cancelBtn.cloneNode(true);
            okBtn.parentNode.replaceChild(newOk, okBtn);
            cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);
            
            newOk.onclick = () => {
                modal.classList.add('hidden');
                onConfirm();
            };
            newCancel.onclick = () => {
                modal.classList.add('hidden');
            };
        };

        function fallbackToLocalMode(errorMsg) {
            if (!isFirebaseActive && firestoreDb === null) return;
            isFirebaseActive = false;
            
            const syncBar = document.getElementById('sync-status');
            syncBar.className = "bg-amber-50 text-amber-600 text-[11px] font-medium px-4 py-1.5 flex items-center justify-center gap-2 border-b border-amber-100";
            syncBar.innerHTML = `<i class="fa-solid fa-hard-drive"></i> 로컬 저장소 모드 동작 중 (${errorMsg || '연결 대기'})`;
            syncBar.classList.remove('hidden');
            
            loadLocalStorage();
            renderApp();
        }

        async function initFirebase() {
            loadLocalStorage();

            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                firestoreDb = getFirestore(app);
                
                await signInAnonymously(auth);
                if (!auth.currentUser) throw new Error("Auth Failed");
                isFirebaseActive = true;
                
                const syncBar = document.getElementById('sync-status');
                syncBar.classList.remove('hidden');
                syncBar.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> 클라우드 실시간 동기화 켜짐`;

                const appId = typeof __app_id !== 'undefined' ? __app_id : 'edu-schedule-app';
                schedulesRef = collection(firestoreDb, 'artifacts', appId, 'public', 'data', 'schedules');
                studentsRef = collection(firestoreDb, 'artifacts', appId, 'public', 'data', 'students');

                onSnapshot(studentsRef, (snapshot) => {
                    const loaded = [];
                    snapshot.forEach(d => {
                        if (d.data().roomCode === window.currentRoomCode) loaded.push({ fbId: d.id, ...d.data() });
                    });
                    mergeStudents(loaded);
                    syncStudentSelections();
                    populateStudentDropdowns();
                    if (!document.getElementById('student-modal').classList.contains('hidden')) window.renderStudentList();
                    renderApp();
                }, (e) => {
                    console.warn("Students snapshot warning:", e.message);
                });

                onSnapshot(schedulesRef, (snapshot) => {
                    const loaded = [];
                    snapshot.forEach(d => {
                        if (d.data().roomCode === window.currentRoomCode) loaded.push({ fbId: d.id, ...d.data() });
                    });
                    mergeSchedules(loaded);
                    renderApp();
                }, (e) => {
                    console.warn("Schedules snapshot warning:", e.message);
                });

            } catch(e) {
                console.warn("Firebase Init Error:", e.message);
                fallbackToLocalMode(e.message);
            }
        }

        function mergeStudents(cloudStudents) {
            const deletedSet = getDeletedIds();
            const mergedMap = new Map();

            window.students.forEach(st => {
                if (st && st.id && !deletedSet.has(st.id)) {
                    mergedMap.set(st.id, st);
                }
            });

            cloudStudents.forEach(cloudStd => {
                if (!cloudStd || !cloudStd.id || deletedSet.has(cloudStd.id)) {
                    if (cloudStd && cloudStd.fbId && isFirebaseActive && firestoreDb && auth.currentUser) {
                        deleteDoc(doc(studentsRef, cloudStd.fbId)).catch(() => {});
                    }
                    return;
                }
                const localStd = mergedMap.get(cloudStd.id);
                if (localStd) {
                    mergedMap.set(cloudStd.id, { ...localStd, ...cloudStd, fbId: cloudStd.fbId });
                } else {
                    mergedMap.set(cloudStd.id, cloudStd);
                }
            });

            window.students = Array.from(mergedMap.values());
            saveData();

            if (isFirebaseActive && firestoreDb && auth.currentUser) {
                window.students.forEach(async (s) => {
                    if (!s.fbId && !deletedSet.has(s.id)) {
                        try {
                            const docRef = await addDoc(studentsRef, s);
                            s.fbId = docRef.id;
                        } catch(e) {}
                    }
                });
            }
        }

        function mergeSchedules(cloudSchedules) {
            const deletedSet = getDeletedIds();
            const mergedMap = new Map();

            window.schedules.forEach(s => {
                if (s && s.id && !deletedSet.has(s.id)) {
                    mergedMap.set(s.id, s);
                }
            });

            cloudSchedules.forEach(cloudSch => {
                if (!cloudSch || !cloudSch.id || deletedSet.has(cloudSch.id)) {
                    if (cloudSch && cloudSch.fbId && isFirebaseActive && firestoreDb && auth.currentUser) {
                        deleteDoc(doc(schedulesRef, cloudSch.fbId)).catch(() => {});
                    }
                    return;
                }
                const localSch = mergedMap.get(cloudSch.id);
                if (localSch) {
                    mergedMap.set(cloudSch.id, { ...localSch, ...cloudSch, fbId: cloudSch.fbId });
                } else {
                    mergedMap.set(cloudSch.id, cloudSch);
                }
            });

            window.schedules = Array.from(mergedMap.values());
            saveData();

            if (isFirebaseActive && firestoreDb && auth.currentUser) {
                window.schedules.forEach(async (sch) => {
                    if (!sch.fbId && !deletedSet.has(sch.id)) {
                        try {
                            const docRef = await addDoc(schedulesRef, sch);
                            sch.fbId = docRef.id;
                        } catch(e) {}
                    }
                });
            }
        }

        function syncStudentSelections() {
            if (!window.selectedStudentIds) {
                window.selectedStudentIds = new Set();
            }
            if (!window.hasInitializedSelections || window.selectedStudentIds.size === 0) {
                window.selectedStudentIds = new Set(window.students.map(s => s.id));
                window.hasInitializedSelections = true;
            } else {
                // Ensure new students are automatically checked by default
                window.students.forEach(s => {
                    if (!window.knownStudentIds || !window.knownStudentIds.has(s.id)) {
                        window.selectedStudentIds.add(s.id);
                    }
                });
            }
            window.knownStudentIds = new Set(window.students.map(s => s.id));
        }

        function findStoredArray(prefix, backupKey) {
            const primary = localStorage.getItem(prefix + window.currentRoomCode);
            if (parseStoredArray(primary).length > 0) return primary;

            const backup = localStorage.getItem(backupKey);
            if (parseStoredArray(backup).length > 0) return backup;

            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (!key || !key.startsWith(prefix) || key.endsWith('_backup')) continue;

                const candidate = localStorage.getItem(key);
                if (parseStoredArray(candidate).length > 0) return candidate;
            }
            return primary || backup;
        }

        function loadLocalStorage() {
            const savedSettings = localStorage.getItem('eduschedule_settings');
            if (savedSettings) {
                try { window.settings = JSON.parse(savedSettings); } catch(e) {}
            }

            const savedStudents = findStoredArray('eduschedule_students_', 'eduschedule_students_backup');

        function renderGrid() {
            const gridDiv = document.getElementById('scheduler-grid');
            
            const startH = window.settings.startHour;
            const endH = window.settings.endHour;
            const hoursCount = endH - startH;
            
            let displayDays = currentDayFilter === 'all' ? [...window.settings.visibleDays] : [currentDayFilter];
            const colCount = displayDays.length;
            const cellHeight = 60;
            const timeColWidth = 55;
            const dayColMinW = currentDayFilter === 'all' ? 100 : 250; 
            
            gridDiv.style.gridTemplateColumns = `${timeColWidth}px repeat(${colCount}, minmax(${dayColMinW}px, 1fr))`;
            gridDiv.style.gridTemplateRows = `40px repeat(${hoursCount}, ${cellHeight}px)`; 
            
            gridDiv.innerHTML = ''; 
            const today = new Date().getDay();

            const corner = document.createElement('div');
            corner.className = 'sticky-corner flex items-center justify-center text-xs shadow-sm';
            corner.innerText = '시간';
            gridDiv.appendChild(corner);

            displayDays.forEach((day) => {
                const th = document.createElement('div');
                const isToday = day === today;
                th.className = `sticky-col-header flex items-center justify-center text-sm font-bold border-r border-slate-100 ${isToday ? 'text-blue-600 bg-blue-50/50' : 'text-slate-700'}`;
                th.innerHTML = `${dayNames[day]} ${isToday ? '<span class="ml-1 w-1.5 h-1.5 bg-blue-500 rounded-full"></span>' : ''}`;
                gridDiv.appendChild(th);
            });

            for (let i = 0; i < hoursCount; i++) {
                const hour = startH + i;
                const timeLabel = document.createElement('div');
                timeLabel.className = 'sticky-row-header flex items-start justify-center pt-2 text-xs font-medium text-slate-500 border-b border-slate-100 bg-slate-50';
                timeLabel.innerText = `${hour.toString().padStart(2, '0')}:00`;
                gridDiv.appendChild(timeLabel);

                displayDays.forEach(day => {
                    const cell = document.createElement('div');
                    const isToday = day === today;
                    cell.className = `border-r border-b border-slate-100 ${isToday ? 'bg-blue-50/10' : ''}`;
                    const halfLine = document.createElement('div');
                    halfLine.className = 'h-1/2 border-b border-slate-50 border-dashed w-full pointer-events-none';
                    cell.appendChild(halfLine);
                    gridDiv.appendChild(cell);
                });
            }

            // Filter schedules based on checkbox selections
            const filteredSchedules = window.schedules.filter(s => {
                const matchStudent = window.selectedStudentIds ? window.selectedStudentIds.has(s.studentId) : true;
                const matchDay = displayDays.includes(Number(s.day));
                return matchStudent && matchDay;
            });

            // COMPUTE OVERLAPS PER DAY (Side-by-side split layout)
            const scheduleLayouts = {}; 
            displayDays.forEach(day => {
                const daySchs = filteredSchedules.filter(s => Number(s.day) === day);
                if (daySchs.length === 0) return;

                daySchs.sort((a, b) => {
                    const diff = timeToMins(a.start) - timeToMins(b.start);
                    if (diff !== 0) return diff;
                    return (timeToMins(b.end) - timeToMins(b.start)) - (timeToMins(a.end) - timeToMins(a.start));
                });

                const columns = [];
                daySchs.forEach(sch => {
                    const sMins = timeToMins(sch.start);
                    const eMins = timeToMins(sch.end);
                    let placedCol = -1;
                    for (let c = 0; c < columns.length; c++) {
                        if (columns[c] <= sMins) {
                            placedCol = c;
                            columns[c] = eMins;
                            break;
                        }
                    }
                    if (placedCol === -1) {
                        placedCol = columns.length;
                        columns.push(eMins);
                    }
                    scheduleLayouts[sch.id] = { col: placedCol, total: 1 };
                });

                daySchs.forEach(sch1 => {
                    const s1 = timeToMins(sch1.start);
                    const e1 = timeToMins(sch1.end);
                    let maxColUsed = scheduleLayouts[sch1.id].col;
                    daySchs.forEach(sch2 => {
                        const s2 = timeToMins(sch2.start);
                        const e2 = timeToMins(sch2.end);
                        if (Math.max(s1, s2) < Math.min(e1, e2)) {
                            maxColUsed = Math.max(maxColUsed, scheduleLayouts[sch2.id].col);
                        }
                    });
                    scheduleLayouts[sch1.id].total = maxColUsed + 1;
                });

                daySchs.forEach(sch1 => {
                    const s1 = timeToMins(sch1.start);
                    const e1 = timeToMins(sch1.end);
                    let groupMax = scheduleLayouts[sch1.id].total;
                    daySchs.forEach(sch2 => {
                        const s2 = timeToMins(sch2.start);
                        const e2 = timeToMins(sch2.end);
                        if (Math.max(s1, s2) < Math.min(e1, e2)) {
                            groupMax = Math.max(groupMax, scheduleLayouts[sch2.id].total);
                        }
                    });
                    scheduleLayouts[sch1.id].total = groupMax;
                });
            });

            filteredSchedules.forEach(sch => {
                const dayIndex = displayDays.indexOf(Number(sch.day));
                if (dayIndex === -1) return; 

                const [sh, sm] = sch.start.split(':').map(Number);
                const [eh, em] = sch.end.split(':').map(Number);
                
                if (eh < startH || sh >= endH) return;
                
                let drawSh = sh < startH ? startH : sh;
                let drawSm = sh < startH ? 0 : sm;
                let drawEh = eh >= endH ? endH : eh;
                let drawEm = eh >= endH ? 0 : em;

                const calculatedTopPx = 40 + (drawSh - startH) * cellHeight + (drawSm / 60) * cellHeight;
                const topPx = Math.max(40, calculatedTopPx);
                
                const calculatedBottomPx = 40 + (drawEh - startH) * cellHeight + (drawEm / 60) * cellHeight;
                const bottomPx = Math.max(topPx + 20, calculatedBottomPx);
                const heightPx = bottomPx - topPx;

                const layout = scheduleLayouts[sch.id] || { col: 0, total: 1 };
                
                const subWidthCalc = `(100% - 55px) / (${colCount} * ${layout.total})`;
                const subLeftCalc = `55px + (100% - 55px) * (${dayIndex} / ${colCount} + ${layout.col} / (${colCount} * ${layout.total}))`;

                const stdColor = window.getStudentColor(sch.studentId);

                const block = document.createElement('div');
                block.className = `schedule-block border flex flex-col justify-between ${typeColors[sch.type] || typeColors['school']}`;
                block.style.top = `${topPx + 1}px`;
                block.style.height = `${heightPx - 2}px`;
                block.style.left = `calc(${subLeftCalc} + 2px)`;
                block.style.width = `calc(${subWidthCalc} - 4px)`;
                block.style.borderLeft = `4px solid ${stdColor.badgeBg}`;

                const studentInfo = getStudentInfo(sch.studentId);
                const localAlarm = window.getLocalAlarm(sch.id);
                let html = `<div class="font-bold text-xs truncate leading-tight pointer-events-none">${escapeHtml(sch.title)}</div>`;
                if (heightPx > 40) {
                    html += `<div class="mt-0.5 truncate pointer-events-none">
                        <span class="inline-block px-1.5 py-0.2 text-[9px] font-extrabold text-white rounded-full shadow-xs" style="background-color: ${stdColor.badgeBg};">
                            ${escapeHtml(studentInfo.name)}
                        </span>
                    </div>`;
                    if(sch.pickupLocation && heightPx > 58) {
                        html += `<div class="text-[9px] opacity-75 truncate pointer-events-none mt-0.5"><i class="fa-solid fa-bus text-[8px] mr-0.5"></i>탑승: ${escapeHtml(sch.pickupLocation)}</div>`;
                    }
                    if(sch.dropoffLocation && heightPx > 72) {
                        html += `<div class="text-[9px] opacity-75 truncate pointer-events-none"><i class="fa-solid fa-flag-checkered text-[8px] mr-0.5"></i>하차: ${escapeHtml(sch.dropoffLocation)}</div>`;
                    }
                    if(((localAlarm.alarmBefore > 0) || (localAlarm.alarmEndBefore > 0)) && heightPx > 86) {
                        html += `<div class="text-[9px] text-amber-700 truncate pointer-events-none"><i class="fa-solid fa-bell text-[8px] mr-0.5"></i>알람</div>`;
                    }
                    html += `<div class="text-[9px] opacity-75 mt-auto text-right truncate pointer-events-none">${sch.start} - ${sch.end}</div>`;
                }
                block.innerHTML = html;
                
                let dragTimer = null;
                let isDragging = false;
                let startX, startY;

                const onMove = (e) => {
                    if (!isDragging) return;
                    e.preventDefault();
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    block.style.transform = `translate(${dx}px, ${dy}px) scale(1.03)`;
                };

                const onUp = async (e) => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                    window.removeEventListener('pointercancel', onUp);
                    block.style.touchAction = ''; 

                    if (!isDragging) return;
                    isDragging = false;
                    
                    block.style.transition = 'all 0.2s ease';
                    block.classList.remove('shadow-xl', 'ring-2', 'ring-blue-500', 'z-50', 'opacity-90');
                    
                    const gridRect = gridDiv.getBoundingClientRect();
                    const blockRect = block.getBoundingClientRect();
                    
                    const dropX = blockRect.left + (blockRect.width / 2) - gridRect.left;
                    const dropY = blockRect.top - gridRect.top;
                    
                    if (dropX > timeColWidth && dropX < gridRect.width && dropY > 40 && dropY < gridRect.height) {
                        const colW = (gridRect.width - timeColWidth) / displayDays.length;
                        const targetCol = Math.floor((dropX - timeColWidth) / colW);
                        const newDay = displayDays[targetCol];
                        
                        const rawMins = ((dropY - 40) / cellHeight) * 60;
                        let snappedMins = (startH * 60) + Math.round(rawMins / 5) * 5;
                        if(snappedMins < startH * 60) snappedMins = startH * 60;

                        const oldDur = window.timeToMins(sch.end) - window.timeToMins(sch.start);
                        const newStartStr = window.minsToStr(snappedMins);
                        const newEndStr = window.minsToStr(snappedMins + oldDur);
                        
                        await updateScheduleTimeAndDay(sch.id, newDay, newStartStr, newEndStr);
                    } else {
                        block.style.transform = 'none';
                    }
                };

                block.addEventListener('pointerdown', (e) => {
                    if (e.pointerType === 'mouse' && e.button !== 0) return; 
                    startX = e.clientX;
                    startY = e.clientY;
                    
                    dragTimer = setTimeout(() => {
                        isDragging = true;
                        block.style.touchAction = 'none';
                        block.style.transition = 'none';
                        block.classList.add('shadow-xl', 'ring-2', 'ring-blue-500', 'z-50', 'opacity-90');
                        
                        window.addEventListener('pointermove', onMove, { passive: false });
                        window.addEventListener('pointerup', onUp);
                        window.addEventListener('pointercancel', onUp);
                        if (navigator.vibrate) navigator.vibrate(40);
                    }, 300);
                });

                block.addEventListener('pointermove', (e) => {
                    if (!isDragging && dragTimer) {
                        if (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) {
                            clearTimeout(dragTimer);
                            dragTimer = null;
                        }
                    }
                });

                block.addEventListener('pointerup', () => {
                    if (dragTimer) { clearTimeout(dragTimer); dragTimer = null; }
                    if (!isDragging) { openScheduleModal(sch.id); }
                });
                
                block.addEventListener('pointercancel', () => {
                    if (dragTimer) { clearTimeout(dragTimer); dragTimer = null; }
                });

                gridDiv.appendChild(block);
            });

            updateTimeTracker(startH, endH, cellHeight);
        }

        let trackerInterval = null;
        function updateTimeTracker(startH, endH, cellHeight) {
            const gridDiv = document.getElementById('scheduler-grid');
            const oldTracker = document.getElementById('time-tracker');
            if (oldTracker) oldTracker.remove();
            if (trackerInterval) clearInterval(trackerInterval);

            const drawTracker = () => {
                const now = new Date();
                const h = now.getHours();
                const m = now.getMinutes();

                if (h >= startH && h < endH) {
                    const topPx = 40 + (h - startH) * cellHeight + (m / 60) * cellHeight;
                    let tracker = document.getElementById('time-tracker');
                    if (!tracker) {
                        tracker = document.createElement('div');
                        tracker.id = 'time-tracker';
                        tracker.className = 'time-tracker-line';
                        const dot = document.createElement('div');
                        dot.className = 'time-tracker-dot';
                        tracker.appendChild(dot);
                        gridDiv.appendChild(tracker);
                    }
                    tracker.style.top = `${topPx}px`;
                }
            };
            drawTracker(); 
            trackerInterval = setInterval(drawTracker, 60000); 
        }

        let alarmCheckerInterval = null;
        const triggeredAlarms = new Set();

        function initAlarmChecker() {
            if (alarmCheckerInterval) clearInterval(alarmCheckerInterval);
            if ("Notification" in window && Notification.permission !== "granted") {
                Notification.requestPermission().catch(() => {});
            }

            alarmCheckerInterval = setInterval(() => {
                const now = new Date();
                const currentDay = now.getDay();
                const currentTotalMins = now.getHours() * 60 + now.getMinutes();
                const dateStr = now.toISOString().split('T')[0];

                window.schedules.forEach(sch => {
                    if (Number(sch.day) !== currentDay) return;
                    const startMins = window.timeToMins(sch.start);
                    const endMins = window.timeToMins(sch.end);
                    const std = getStudentInfo(sch.studentId);
                    const localAlarm = window.getLocalAlarm(sch.id);

                    if (localAlarm.alarmBefore && Number(localAlarm.alarmBefore) > 0) {
                        const alarmTargetMins = startMins - Number(localAlarm.alarmBefore);
                        const alarmKey = `${dateStr}-${sch.id}-before-${alarmTargetMins}`;
                        if (currentTotalMins === alarmTargetMins && !triggeredAlarms.has(alarmKey)) {
                            triggeredAlarms.add(alarmKey);
                            const msg = `[알람] ${std.name} 학생의 '${sch.title}' 일정(${sch.start})이 ${localAlarm.alarmBefore}분 전입니다!`;
                            window.showToast(msg, 'warning');
                            if ("Notification" in window && Notification.permission === "granted") {
                                new Notification("에듀스케줄 알람", { body: msg });
                            }
                        }
                    }

                    if (localAlarm.alarmEndBefore && Number(localAlarm.alarmEndBefore) > 0) {
                        const alarmTargetMins = endMins - Number(localAlarm.alarmEndBefore);
                        const alarmKey = `${dateStr}-${sch.id}-endbefore-${alarmTargetMins}`;
                        if (currentTotalMins === alarmTargetMins && !triggeredAlarms.has(alarmKey)) {
                            triggeredAlarms.add(alarmKey);
                            const msg = `[알람] ${std.name} 학생의 '${sch.title}' 일정 종료(${sch.end})가 ${localAlarm.alarmEndBefore}분 전입니다!`;
                            window.showToast(msg, 'warning');
                            if ("Notification" in window && Notification.permission === "granted") {
                                new Notification("에듀스케줄 알람", { body: msg });
                            }
                        }
                    }
                });
            }, 30000);
        }

        function calculateDday(targetDate) {
            if(!targetDate) return "";
            const today = new Date();
            today.setHours(0,0,0,0);
            const target = new Date(targetDate);
            const diff = target - today;
            const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
            if(days === 0) return "D-Day!";
            if(days > 0) return `D-${days}`;
            return `D+${Math.abs(days)}`;
        }

        window.checkConflicts = function() {
            const conflictList = document.getElementById('conflict-list');
            const badge = document.getElementById('conflict-badge');
            let issues = [];
            
            window.students.forEach(std => {
                if (window.selectedStudentIds && !window.selectedStudentIds.has(std.id)) return;
                for(let day = 0; day <= 6; day++) {
                    const daySchs = window.schedules.filter(s => s.studentId === std.id && Number(s.day) === day);
                    if(daySchs.length < 2) continue;
                    daySchs.sort((a, b) => a.start.localeCompare(b.start));
                    
                    for(let i=0; i < daySchs.length - 1; i++) {
                        const current = daySchs[i];
                        const next = daySchs[i+1];
                        const currEndMins = window.timeToMins(current.end);
                        const nextStartMins = window.timeToMins(next.start);
                        
                        if (currEndMins > nextStartMins) {
                            issues.push({ type: 'overlap', student: std.name, day: dayNames[day], sch1: current.title, sch2: next.title, msg: '시간이 겹칩니다!' });
                        } else if (nextStartMins - currEndMins < 15) {
                            issues.push({ type: 'rush', student: std.name, day: dayNames[day], sch1: current.title, sch2: next.title, msg: `이동시간이 ${nextStartMins - currEndMins}분 미만입니다.` });
                        }
                    }
                }
            });
            
            if (issues.length > 0) {
                badge.innerText = issues.length;
                badge.classList.remove('hidden');
                let html = '';
                issues.forEach(iss => {
                    const icon = iss.type === 'overlap' ? '<i class="fa-solid fa-triangle-exclamation text-red-500 text-lg"></i>' : '<i class="fa-solid fa-person-running text-amber-500 text-lg"></i>';
                    const bg = iss.type === 'overlap' ? 'bg-red-50 border-red-200' : 'bg-amber-50 border-amber-200';
                    html += `
                    <div class="p-3 rounded-lg border ${bg} flex items-start gap-3">
                        <div class="pt-1">${icon}</div>
                        <div>
                            <h4 class="font-bold text-slate-800 text-sm">${escapeHtml(iss.student)} 학생 (${escapeHtml(iss.day)}요일)</h4>
                            <p class="text-xs text-slate-600 mt-1"><span class="font-semibold">${escapeHtml(iss.sch1)}</span> ➔ <span class="font-semibold">${escapeHtml(iss.sch2)}</span></p>
                            <p class="text-xs font-bold text-red-600 mt-1">${escapeHtml(iss.msg)}</p>
                        </div>
                    </div>`;
                });
                conflictList.innerHTML = html;
            } else {
                badge.classList.add('hidden');
                conflictList.innerHTML = `<div class="text-center text-slate-500 py-10 text-sm"><i class="fa-regular fa-circle-check text-emerald-500 text-2xl mb-2 block"></i>충돌하는 일정이 없습니다. 완벽해요!</div>`;
            }
        }

        window.saveSchedule = async function() {
            const title = document.getElementById('s-title').value.trim();
            const start = document.getElementById('s-start').value;
            const end = document.getElementById('s-end').value;
            if (!title || !start || !end) {
                window.showToast("제목, 시작시간, 종료시간을 모두 입력해주세요.", "warning");
                return;
            }
            if (start >= end) {
                window.showToast("종료 시간이 시작 시간보다 빨라야 합니다.", "warning");
                return;
            }

            const id = document.getElementById('edit-id').value;
            const alarmBefore = document.getElementById('s-alarm-before').value;
            const alarmEndBefore = document.getElementById('s-alarm-end-before').value;

            const schData = {
                studentId: document.getElementById('s-student').value,
                title: title,
                type: document.getElementById('s-type').value,
                day: Number(document.getElementById('s-day').value),
                start: start,
                end: end,
                pickupLocation: document.getElementById('s-pickup').value.trim(),
                dropoffLocation: document.getElementById('s-dropoff').value.trim(),
                memo: document.getElementById('s-memo').value.trim(),
                dday: document.getElementById('s-dday').value,
                roomCode: window.currentRoomCode
            };

            // Ensure student is active in selected filter
            if (!window.selectedStudentIds) window.selectedStudentIds = new Set();
            window.selectedStudentIds.add(schData.studentId);

            // Ensure day is active in settings if hidden
            if (!window.settings.visibleDays.includes(schData.day)) {
                window.settings.visibleDays.push(schData.day);
                window.settings.visibleDays.sort((a,b) => (a===0?7:a) - (b===0?7:b));
                saveSettingsToLocal();
            }

            if (id) {
                const idx = window.schedules.findIndex(s => s.id === id);
                if(idx > -1) {
                    schData.id = id;
                    schData.fbId = window.schedules[idx].fbId;
                    window.schedules[idx] = schData;
                }
                window.saveLocalAlarm(id, alarmBefore, alarmEndBefore);
            } else {
                schData.id = 'sch_' + Date.now();
                window.schedules.push(schData);
                window.saveLocalAlarm(schData.id, alarmBefore, alarmEndBefore);
            }
            saveData();
            renderApp();

            if (isFirebaseActive && firestoreDb && auth.currentUser) {
                try {
                    if (id) {
                        const target = window.schedules.find(s => s.id === id);
                        if(target && target.fbId) await updateDoc(doc(schedulesRef, target.fbId), schData);
                    } else {
                        await addDoc(schedulesRef, schData);
                    }
                } catch(e) { console.warn(e); }
            }
            closeScheduleModal();
            window.showToast("일정이 안전하게 저장되었습니다.");
        }

            }
            const today = new Date();
            let text = `[에듀스케줄 - ${today.getMonth()+1}/${today.getDate()} 일정]\n\n`;
            let todaysSch = window.schedules.filter(s => Number(s.day) === today.getDay() && (window.selectedStudentIds ? window.selectedStudentIds.has(s.studentId) : true));
            todaysSch.sort((a, b) => a.start.localeCompare(b.start));
            
            todaysSch.forEach(sch => {
                const std = getStudentInfo(sch.studentId);
                text += `• ${std.name}: ${sch.title} (${sch.start}~${sch.end})\n`;
                if(sch.pickupLocation || sch.dropoffLocation) {
                    text += `  └ 차량: ${sch.pickupLocation ? '탑승('+sch.pickupLocation+') ' : ''}${sch.dropoffLocation ? '하차('+sch.dropoffLocation+')' : ''}\n`;
                }
                if(sch.memo) text += `  └ 메모: ${sch.memo}\n`;
            });
            text += `\n*에듀스케줄에서 공유됨`;
            
            window.copyToClipboard(text, "일정 요약이 클립보드에 복사되었습니다!");
        }

        document.addEventListener('DOMContentLoaded', () => {
            initFirebase();
            initAlarmChecker();
            window.addEventListener('resize', () => { if(!document.getElementById('view-weekly').classList.contains('hidden')) renderGrid(); });
        });
    </script>
</body>
</html>
